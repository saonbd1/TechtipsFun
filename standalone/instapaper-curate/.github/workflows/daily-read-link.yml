name: Daily read link

# Every day at 09:00 UTC, pick the next unposted link from data/read-queue.json
# and save it into your Instapaper folder. The cursor in
# data/read-queue-state.json is committed so the queue survives between runs.
#
# The folder is configurable with the repository variable INSTAPAPER_FOLDER
# (Settings → Secrets and variables → Actions → Variables). Default: "Tech News".

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add the next queued link to Instapaper
        env:
          INSTAPAPER_CONSUMER_KEY: ${{ secrets.INSTAPAPER_CONSUMER_KEY }}
          INSTAPAPER_CONSUMER_SECRET: ${{ secrets.INSTAPAPER_CONSUMER_SECRET }}
          INSTAPAPER_EMAIL: ${{ secrets.INSTAPAPER_EMAIL }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          INSTAPAPER_FOLDER: ${{ vars.INSTAPAPER_FOLDER || 'Tech News' }}
        run: node scripts/daily-read-link.mjs

      - name: Commit the queue cursor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/read-queue-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: advance the read-queue cursor"
          git push
