name: Submit URLs to IndexNow

# Notifies Bing/Yandex-class engines instantly when a post is added or edited.
# - Automatic: fires on pushes to main touching src/content/blog/** (new posts
#   AND content edits; renames/updates are submitted as URL_UPDATED via the
#   same urlList field — IndexNow treats all entries as "fetch this now").
# - Manual: Actions -> Submit URLs to IndexNow -> Run workflow (slug or --latest).
#
# IMPORTANT PITFALL (same as LinkedIn/YouTube jobs): pushes made with
# GITHUB_TOKEN do NOT trigger other workflows. The "Schedule post publishing"
# commit therefore never fires the push event here — so that workflow calls
# this script directly (see schedule-posts.yml). This workflow covers manual
# pushes and the manual button.
#
# Google does NOT support IndexNow. Google discovery stays via sitemap
# (lastmod from updatedDate/pubDate in astro.config.mjs) + Search Console.
#
# Requires the INDEXNOW_KEY repo secret (must match public/<key>.txt).

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:
    inputs:
      slug:
        description: Post slug to submit (filename without .md/.mdx; empty = auto-detect from push)
        required: false

permissions:
  contents: write # to commit .indexnow-submitted.json back

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect changed posts
        id: posts
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "slugs=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          ALL_ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ALL_ZERO" ]; then
            echo "Initial push; skipping automatic submit."
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BEFORE" "${{ github.event.sha }}" -- src/content/blog/ | grep -E '\.(md|mdx)$' || true)
          if [ -z "$FILES" ]; then
            echo "No post changes."
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SLUGS=$(echo "$FILES" | sed -E 's#.*/##; s/\.(md|mdx)$//' | paste -sd,)
          echo "Changed posts: $SLUGS"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow
        if: steps.posts.outputs.slugs != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          node scripts/submit-indexnow.mjs --slugs "${{ steps.posts.outputs.slugs }}"

      - name: Commit submission manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f .indexnow-submitted.json ] || { echo "Nothing new submitted."; exit 0; }
          git add .indexnow-submitted.json
          git diff --cached --quiet && echo "Nothing new submitted." || \
            (git commit -m "chore: record IndexNow submissions [skip ci]" && git push)
